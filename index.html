<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Our China Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zhi+Mang+Xing&family=Young+Serif&family=Albert+Sans:wght@400;500;700&family=Kalam:wght@400;700&display=swap">
<style>
/* Layout: a jade pinboard. Taped postcards, sticky notes and food tickets in a loose masonry; each stop gets its own board, reached from the route strip. */
:root {
  --board: #dce6df;
  --board-dot: rgba(30, 52, 42, .10);
  --paper: #fbfaf5;
  --ink: #1c2622;
  --muted: #56655e;
  --seal: #c23a22;
  --seal-ink: #fff6ee;
  --gold: #a87a1c;
  --note: #f4e47e;
  --note-ink: #3a3214;
  --tape: rgba(232, 214, 160, .78);
  --line: rgba(28, 38, 34, .14);
  --shadow: 0 1px 2px rgba(20, 34, 28, .14), 0 10px 22px -10px rgba(20, 34, 28, .38);
  --f-brush: "Zhi Mang Xing", "STKaiti", "KaiTi", "Kaiti SC", serif;
  --f-display: "Young Serif", Georgia, "Times New Roman", serif;
  --f-body: "Albert Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-hand: "Kalam", "Segoe Print", "Bradley Hand", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --board: #101814; --board-dot: rgba(200, 230, 214, .07); --paper: #1c2622; --ink: #e6ede9; --muted: #9caba4;
    --seal: #e2563b; --seal-ink: #1a0f0c; --gold: #d9ad4c; --note: #57501f; --note-ink: #f7efbf;
    --tape: rgba(200, 182, 128, .45); --line: rgba(230, 237, 233, .13);
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 12px 26px -10px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --board: #101814; --board-dot: rgba(200, 230, 214, .07); --paper: #1c2622; --ink: #e6ede9; --muted: #9caba4;
  --seal: #e2563b; --seal-ink: #1a0f0c; --gold: #d9ad4c; --note: #57501f; --note-ink: #f7efbf;
  --tape: rgba(200, 182, 128, .45); --line: rgba(230, 237, 233, .13);
  --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 12px 26px -10px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background-color: var(--board);
  background-image: radial-gradient(var(--board-dot) 1px, transparent 1.4px);
  background-size: 14px 14px;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.55;
}
a { color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 4px; }

.wrap {
  max-width: 1180px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- header ---------- */
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: color-mix(in srgb, var(--board) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
header.top .wrap { display: flex; align-items: center; gap: 10px 16px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--f-display); font-size: 18px; }
.seal {
  display: inline-grid; place-items: center;
  background: var(--seal); color: var(--seal-ink);
  font-family: var(--f-brush); line-height: .9;
  border-radius: 4px;
  writing-mode: vertical-rl;
}
.brand .seal { width: 34px; height: 34px; font-size: 15px; }
nav.stops { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
nav.stops a {
  text-decoration: none; font-size: 14px; font-weight: 500;
  padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--paper);
}
nav.stops a[aria-current="page"] { background: var(--ink); color: var(--board); border-color: var(--ink); }
@media (max-width: 720px) { nav.stops { margin-left: 0; } }

/* ---------- hero ---------- */
.hero { padding-block: 40px 24px; display: grid; grid-template-columns: auto 1fr; gap: 8px 28px; align-items: end; }
.hero .brush {
  font-family: var(--f-brush); font-size: clamp(88px, 17vw, 190px); line-height: .85; color: var(--seal);
  grid-row: span 2;
}
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.hero h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(36px, 6vw, 64px); line-height: 1.02; margin: 4px 0 0; text-wrap: balance; }
.hero p.lede { margin: 10px 0 0; max-width: 58ch; color: var(--muted); font-size: 18px; }
@media (max-width: 640px) {
  .hero { grid-template-columns: 1fr; }
  .hero .brush { grid-row: auto; }
}

.facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.facts span { background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 14px; font-variant-numeric: tabular-nums; }
.facts b { font-weight: 700; }

/* ---------- route strip ---------- */
.route { margin-block: 8px 28px; overflow-x: auto; }
.route ol { list-style: none; margin: 0; padding: 8px 2px 6px; display: flex; min-width: max-content; }
.route li { display: flex; align-items: center; }
.route li + li::before { content: ""; width: 30px; border-top: 2px dashed var(--muted); opacity: .6; margin-inline: 6px; }
.route a { display: grid; grid-template-columns: auto auto; gap: 0 8px; align-items: center; text-decoration: none; }
.route .num {
  width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; grid-row: span 2;
  border: 2px solid var(--seal); color: var(--seal); font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums;
}
.route .nm { font-family: var(--f-display); font-size: 16px; line-height: 1.2; }
.route .dt { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- board ---------- */
.board { columns: 4 250px; column-gap: 22px; padding-block: 8px 40px; }
.board > * { break-inside: avoid; margin: 0 0 26px; display: block; }
.tilt-a { transform: rotate(-1.6deg); }
.tilt-b { transform: rotate(1.2deg); }
.tilt-c { transform: rotate(-.6deg); }
.tilt-d { transform: rotate(2deg); }

.taped { position: relative; }
.taped::before {
  content: ""; position: absolute; top: -11px; left: 50%; width: 92px; height: 24px;
  transform: translateX(-50%) rotate(-3deg);
  background: var(--tape); box-shadow: 0 1px 2px rgba(0,0,0,.08); z-index: 2;
}

.postcard { background: var(--paper); padding: 10px 10px 14px; box-shadow: var(--shadow); text-decoration: none; transition: transform .25s ease; }
a.postcard:hover { transform: rotate(0deg) scale(1.02); }
.scene { position: relative; aspect-ratio: 3 / 2; max-width: 100%; overflow: hidden; }
.scene svg { display: block; width: 100%; height: 100%; }
.scene .glyph {
  position: absolute; left: 12px; top: 6px;
  font-family: var(--f-brush); font-size: 50px; line-height: 1; color: #fffdf6;
  text-shadow: 0 2px 10px rgba(0,0,0,.35);
}
.scene.big .glyph { font-size: 80px; }
.postcard .day { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--gold); margin-top: 10px; }
.postcard .cap { font-family: var(--f-hand); font-size: 19px; line-height: 1.25; margin-top: 4px; }
.postcard .sub { font-size: 14px; color: var(--muted); margin-top: 4px; }
.postcard .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.postcard .who { font-size: 12px; color: var(--muted); }
.postcard .photos { font-size: 13px; font-weight: 700; color: var(--seal); text-decoration: none; }
.postcard .photos:hover { text-decoration: underline; }
.postcard .more { display: inline-block; margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--seal); letter-spacing: .04em; }

.sticky {
  background: var(--note); color: var(--note-ink);
  padding: 22px 20px 26px; box-shadow: var(--shadow);
  font-family: var(--f-hand); font-size: 21px; line-height: 1.3;
}
.sticky small { display: block; font-family: var(--f-body); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; opacity: .7; margin-bottom: 6px; }

.ticket {
  background: var(--paper); box-shadow: var(--shadow); padding: 16px 18px;
  border-left: 6px solid var(--seal);
  display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; align-items: center;
  position: relative;
}
.ticket::after { content: ""; position: absolute; right: 12px; top: 10px; bottom: 10px; border-right: 2px dashed var(--line); }
.ticket .zh { font-family: var(--f-brush); font-size: 40px; line-height: 1; color: var(--seal); grid-row: span 2; }
.ticket .t { font-family: var(--f-display); font-size: 18px; line-height: 1.2; padding-right: 18px; }
.ticket .d { font-size: 14px; color: var(--muted); padding-right: 18px; }
.ticket .lbl { grid-column: 1 / -1; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--gold); margin-bottom: 6px; }

.phrase { background: var(--ink); color: var(--board); padding: 20px; box-shadow: var(--shadow); text-align: center; }
.phrase .lbl { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; opacity: .7; }
.phrase .zh { font-family: var(--f-brush); font-size: 64px; line-height: 1.1; margin-top: 6px; }
.phrase .py { font-family: var(--f-display); font-size: 20px; }
.phrase .en { font-size: 14px; opacity: .8; margin-top: 2px; }

.swatches { background: var(--paper); padding: 14px; box-shadow: var(--shadow); }
.swatches .row { display: grid; grid-template-columns: repeat(4, 1fr); height: 64px; }
.swatches .row span { display: block; }
.swatches .lbl { font-family: var(--f-hand); font-size: 18px; margin-top: 10px; }

.checklist { background: var(--paper); padding: 18px 20px; box-shadow: var(--shadow);
  background-image: repeating-linear-gradient(transparent 0 33px, var(--line) 33px 34px); background-position: 0 52px; }
.checklist h3 { margin: 0 0 8px; font-family: var(--f-display); font-weight: 400; font-size: 20px; }
.checklist label { display: flex; gap: 10px; align-items: center; min-height: 34px; font-family: var(--f-hand); font-size: 18px; cursor: pointer; line-height: 1.2; }
.checklist input { width: 18px; height: 18px; accent-color: var(--seal); flex: none; }
.checklist input:checked + span { text-decoration: line-through; text-decoration-color: var(--seal); opacity: .6; }
.checklist .count { font-size: 13px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }

.stamp { display: grid; place-items: center; padding: 24px 10px; }
.stamp .seal { width: 120px; height: 120px; font-size: 46px; transform: rotate(-6deg); box-shadow: var(--shadow); border: 4px double var(--seal-ink); }
.stamp p { font-family: var(--f-hand); font-size: 18px; text-align: center; margin: 14px 0 0; color: var(--muted); }

/* ---------- city page ---------- */
.city-hero { padding-block: 32px 12px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 32px; align-items: center; }
.city-hero .brush { font-family: var(--f-brush); font-size: clamp(84px, 13vw, 150px); line-height: .9; color: var(--seal); }
.city-hero h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(34px, 5vw, 54px); line-height: 1.05; margin: 6px 0 10px; text-wrap: balance; }
.city-hero p { margin: 0; color: var(--muted); font-size: 17px; max-width: 52ch; }
.city-hero .postcard { transform: rotate(1.4deg); }
@media (max-width: 760px) { .city-hero { grid-template-columns: 1fr; } }

.section-label { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.section-label::after { content: ""; flex: 1; border-top: 1px solid var(--line); }

.pager { display: flex; justify-content: space-between; gap: 12px; padding-block: 8px 48px; flex-wrap: wrap; }
.pager a { text-decoration: none; background: var(--paper); box-shadow: var(--shadow); padding: 12px 18px; display: grid; min-width: 0; }
.pager a small { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.pager a span { font-family: var(--f-display); font-size: 20px; }
.pager a.next { text-align: right; margin-left: auto; }

/* ---------- day-by-day timeline ---------- */
.days { display: grid; gap: 30px; padding-block: 20px 36px; }
.dayrow { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 20px; align-items: start; }
.daylabel { display: grid; justify-items: start; padding-top: 6px; border-top: 3px solid var(--seal); }
.daylabel .dow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--seal); margin-top: 6px; }
.daylabel .date { font-family: var(--f-display); font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.daycards, .stops-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 26px 22px; }
.stops-grid { padding-block: 12px 36px; }
.daycards > *, .stops-grid > * { margin: 0; }
@media (max-width: 560px) {
  .dayrow { grid-template-columns: 1fr; gap: 10px; }
  .daylabel { grid-auto-flow: column; gap: 10px; align-items: baseline; }
  .daycards > *, .stops-grid > * { transform: none; }
}

/* ---------- guided tours (brochure cards) ---------- */
.tours-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; margin-top: 4px; }
.tours-head h2, .alt-city h2 { font-family: var(--f-display); font-weight: 400; font-size: 28px; margin: 0; }
.tours-head p { margin: 0; color: var(--muted); font-size: 14px; }
.tours { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; padding-block: 16px 40px; }
.tour {
  background: var(--paper); box-shadow: var(--shadow); padding: 0 18px 16px;
  display: flex; flex-direction: column; gap: 6px; min-width: 0;
  border-top: 8px solid var(--seal);
}
.tour .len { align-self: flex-start; background: var(--seal); color: var(--seal-ink); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; padding: 3px 10px 4px; border-radius: 0 0 6px 6px; }
.tour h3 { font-family: var(--f-display); font-weight: 400; font-size: 19px; line-height: 1.2; margin: 6px 0 0; }
.tour p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; }
.tour a { font-size: 13px; font-weight: 700; color: var(--seal); text-decoration: none; margin-top: 4px; }
.tour a:hover { text-decoration: underline; }

/* ---------- alternatives page ---------- */
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-block: 4px 8px; }
.filters button {
  font: 500 14px var(--f-body); color: var(--ink); background: var(--paper);
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer;
}
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--board); border-color: var(--ink); }
.alt-city { padding-block: 22px 4px; border-bottom: 1px solid var(--line); }
.alt-city header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.alt-city .zh { font-family: var(--f-brush); font-size: 44px; line-height: 1; color: var(--seal); }
.alt-city header a { font-size: 13px; color: var(--muted); }
.alts { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; padding-block: 14px 20px; }
.alt { background: var(--paper); box-shadow: var(--shadow); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.alt h3 { font-family: var(--f-hand); font-weight: 700; font-size: 19px; line-height: 1.2; margin: 0; }
.alt p { margin: 0; font-size: 14px; color: var(--muted); flex: 1; }
.alt .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tags span { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--gold); border: 1px solid currentColor; border-radius: 4px; padding: 1px 6px; }
.alt a { font-size: 13px; font-weight: 700; color: var(--seal); text-decoration: none; }
.empty { color: var(--muted); font-style: italic; padding-block: 8px 16px; }

footer { padding-block: 12px 40px; color: var(--muted); font-size: 13px; }

@media (max-width: 560px) {
  .board { columns: 1; }
  .board > * { transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>

  <div class="wrap">

</header>

<main class="wrap" id="main"></main>

    let y = base - r() * amp;
    if (style === "karst") y = base - (r() < .55 ? amp * (.6 + r() * .5) : amp * r() * .25);
    pts.push([x, y]);
  }
  let d = `M-10,200 L${pts[0][0]},${pts[0][1].toFixed(1)}`;
  for (let i = 1; i < pts.length; i++) {
    const [px, py] = pts[i - 1], [x, y] = pts[i];
    const mx = (px + x) / 2, top = Math.min(py, y);
    d += style === "karst"
      ? ` C${(px + step * .35).toFixed(1)},${py.toFixed(1)} ${(mx - step * .15).toFixed(1)},${(top - 6).toFixed(1)} ${mx.toFixed(1)},${(top - 4).toFixed(1)} S${(x - step * .35).toFixed(1)},${y.toFixed(1)} ${x},${y.toFixed(1)}`
      : ` Q${px},${py.toFixed(1)} ${mx.toFixed(1)},${((py + y) / 2).toFixed(1)}`;
  }
  return d + " L310,200 Z";
}

function skyline(r, base) {
  let d = "", x = -4;
  while (x < 304) {
    const w = 8 + r() * 16, h = 18 + r() * 60;
    d += `<rect x="${x.toFixed(1)}" y="${(base - h).toFixed(1)}" width="${w.toFixed(1)}" height="${(h + 80).toFixed(1)}" />`;
    x += w + 1;
  }
  const t = 120 + r() * 120;
  d += `<rect x="${(t - 2).toFixed(0)}" y="${base - 112}" width="4" height="112"/><circle cx="${t.toFixed(0)}" cy="${base - 70}" r="9"/><circle cx="${t.toFixed(0)}" cy="${base - 100}" r="5"/>`;
  return d;
}

let sceneId = 0;
function scene(key, sky, hill, style = "hills", water = false) {
  const r = rng(hash(key)); const id = "g" + (sceneId++);
  const sunX = 60 + r() * 180, sunY = 40 + r() * 30;
  let layers = "";
  for (let i = 0; i < 3; i++) {
    const base = (water ? 118 : 132) + i * 20;
    const amp = style === "karst" ? 70 - i * 12 : style === "plain" ? 14 + i * 4 : 44 - i * 8;
    const step = style === "karst" ? 26 + r() * 10 : 30;
    layers += `<path d="${ridge(r, base, amp, step, style)}" fill="${hill}" opacity="${(.28 + i * .26).toFixed(2)}"/>`;
  }
  if (style === "skyline") layers = `<path d="${ridge(r, 150, 10, 40, "plain")}" fill="${hill}" opacity=".3"/><g fill="${hill}" opacity=".92">${skyline(r, 150)}</g>`;
  if (style === "plain") layers += `<g fill="${hill}" opacity=".85"><path d="M${(r() * 120 + 70).toFixed(0)},150 l26,-18 l26,18 l-6,0 l0,30 l-40,0 l0,-30 z"/><path d="M${(r() * 60 + 190).toFixed(0)},154 l18,-12 l18,12 l-4,0 l0,26 l-28,0 l0,-26 z"/></g>`;
  const waterSvg = water ? `<rect x="0" y="152" width="300" height="48" fill="${sky[1]}" opacity=".55"/>` +
    [0, 1, 2, 3].map(i => `<line x1="${(r() * 220).toFixed(0)}" x2="${(r() * 220 + 60).toFixed(0)}" y1="${160 + i * 9}" y2="${160 + i * 9}" stroke="#ffffff" stroke-opacity=".45" stroke-width="1.2"/>`).join("") : "";
  return `<svg viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/></linearGradient></defs>
    <rect width="300" height="200" fill="url(#${id})"/>
    <circle cx="${sunX.toFixed(0)}" cy="${sunY.toFixed(0)}" r="16" fill="#fff6e4" opacity=".7"/>
    ${layers}${waterSvg}
  </svg>`;
}

/* ---------- builders ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const tilts = ["tilt-a", "tilt-b", "tilt-c", "tilt-d"];
const tilt = i => tilts[i % tilts.length];
const photoUrl = q => "https://www.google.com/search?tbm=isch&q=" + encodeURIComponent(q);
const shortName = c => c.name.split(" +")[0];

function postcardCity(c, i) {
  const s = c.see[0];
  return `<a class="postcard taped ${tilt(i)}" href="#${c.id}">
    <div class="scene">${scene(c.id + "-cover", c.sky, c.hill, c.style, c.water)}<span class="glyph">${c.zh}</span></div>
    <div class="day">Stop ${i + 1} · ${esc(c.dates)} · ${c.nights} nights</div>
    <div class="cap">${esc(c.name)}</div>
    <div class="sub">${esc(c.tag)}</div>
    <span class="more">Open board →</span>
  </a>`;
}
function spotBody(s) {
  return `<div class="day">${esc(s.day)}</div><div class="cap">${esc(s.title)}</div><div class="sub">${esc(s.note)}</div>
    <div class="row"><span class="who">${esc(s.who)}</span><a class="photos" href="${photoUrl(s.q)}" target="_blank" rel="noopener">Photos ↗</a></div>`;
}
function postcardSpot(c, s, i) {
  return `<figure class="postcard ${i % 2 ? "" : "taped"} ${tilt(i + 1)}">
    <div class="scene">${scene(c.id + s.title, s.sky, c.hill, s.style || c.style, s.water)}<span class="glyph">${s.zh}</span></div>
    <figcaption>${spotBody(s)}</figcaption>
  </figure>`;
}
const ticket = (f, i) => `<div class="ticket ${tilt(i + 2)}"><div class="lbl">Must eat</div><div class="zh">${f.zh}</div><div class="t">${esc(f.title)}</div><div class="d">${esc(f.note)}</div></div>`;
const sticky = (text, label, i) => `<div class="sticky ${tilt(i)}"><small>${esc(label)}</small>${esc(text)}</div>`;

function load(key) { try { return JSON.parse(localStorage.getItem(key) || "[]"); } catch { return []; } }
function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }

/* Sort spots by date, then by time of day ("early" before "morning" before "evening"...). */
const PARTS = [["early", 0], ["7:30", 0], ["late morning", 2], ["morning", 1], ["afternoon", 3], ["dusk", 4], ["evening", 5], ["night", 6]];
function dayKey(label) {
  const m = label.match(/(May|Jun)\s+(\d+)/);
  const date = m ? (m[1] === "Jun" ? 31 : 0) + +m[2] : 99;
  const part = (label.split("·")[1] || "").toLowerCase();
  const hit = PARTS.find(([w]) => part.includes(w));
  return date * 10 + (hit ? hit[1] : 1.5);
}
const sortedSpots = c => [...c.see].sort((a, b) => dayKey(a.day) - dayKey(b.day));

function checklist(c) {
  const items = [...sortedSpots(c).map(s => s.title), ...c.eat.map(f => "Eat " + f.title.charAt(0).toLowerCase() + f.title.slice(1))];
  const done = load("done-" + c.id);
  return `<div class="checklist tilt-c" data-city="${c.id}">
    <h3>${esc(shortName(c))} bucket list</h3>
    ${items.map((t, i) => `<label><input type="checkbox" id="chk-${c.id}-${i}" data-i="${i}" ${done.includes(i) ? "checked" : ""}><span>${esc(t)}</span></label>`).join("")}
    <div class="count"></div>
  </div>`;
}

function cityPage(c) {
  const idx = CITIES.indexOf(c);
  const prev = CITIES[idx - 1], next = CITIES[idx + 1];
  const groups = [];
  sortedSpots(c).forEach(s => {
    const date = s.day.split("·")[0].trim();
    let g = groups.find(x => x.date === date);
    if (!g) groups.push(g = { date, items: [] });
    g.items.push(s);
  });
  let n = 0;
  const days = groups.map(g => {
    const [dow, ...rest] = g.date.split(" ");
    return `<div class="dayrow"><div class="daylabel"><span class="dow">${esc(dow)}</span><span class="date">${esc(rest.join(" "))}</span></div>
      <div class="daycards">${g.items.map(s => postcardSpot(c, s, n++)).join("")}</div></div>`;
  }).join("");
  const tiles = c.eat.map((f, i) => ticket(f, i));
  tiles.splice(0, 0, sticky(c.builtFor, "Built for", 1));
  tiles.splice(2, 0, `<div class="phrase tilt-b"><div class="lbl">Phrase to learn</div><div class="zh">${c.phrase.zh}</div><div class="py">${c.phrase.py}</div><div class="en">${esc(c.phrase.en)}</div></div>`);
  tiles.splice(4, 0, sticky(c.note, "Note to us", 3));
  tiles.push(`<div class="swatches taped tilt-a"><div class="row">${c.palette.map(p => `<span style="background:${p}"></span>`).join("")}</div><div class="lbl">The colors of ${esc(shortName(c))}</div></div>`);
  tiles.push(checklist(c));
  tiles.push(`<div class="stamp"><span class="seal">${c.zh}</span><p>Stop ${idx + 1} of ${CITIES.length}</p></div>`);

  return `
  <section class="city-hero">
    <div>
      <div class="brush" lang="zh">${c.zh}</div>
      <div class="eyebrow">Stop ${idx + 1} of ${CITIES.length}</div>
      <h1>${esc(c.name)}</h1>
      <p>${esc(c.intro)}</p>
      <div class="facts"><span><b>${esc(c.dates)}</b></span><span>${c.nights} nights</span><span>${esc(c.arrive)}</span></div>
    </div>
    <figure class="postcard taped" style="margin:0">
      <div class="scene big">${scene(c.id + "-cover", c.sky, c.hill, c.style, c.water)}</div>
      <figcaption><div class="day">Stop ${idx + 1} · ${esc(c.dates)}</div><div class="cap">${esc(c.tag)}</div></figcaption>
    </figure>
  </section>
  <div class="section-label eyebrow">Day by day</div>
  <section class="days">${days}</section>
  <div class="section-label eyebrow">The board</div>
  <section class="board">${tiles.join("")}</section>
  <div class="section-label eyebrow">Popular guided tours</div>
  <div class="tours-head"><h2>Tours in ${esc(shortName(c))}</h2><p>Links open a search for current operators and prices. <a href="#alternatives">See alternative activities →</a></p></div>
  <section class="tours">${(TOURS[c.id] || []).map(t => `<article class="tour"><span class="len">${esc(t.length)}</span><h3>${esc(t.title)}</h3><p>${esc(t.note)}</p><a href="https://www.google.com/search?q=${encodeURIComponent(t.q)}" target="_blank" rel="noopener">Find this tour ↗</a></article>`).join("")}</section>
  <nav class="pager" aria-label="Next and previous stop">
    ${prev ? `<a href="#${prev.id}"><small>← Previous stop</small><span>${esc(prev.name)}</span></a>` : `<a href="#board"><small>← Back to</small><span>The whole trip</span></a>`}
    ${next ? `<a class="next" href="#${next.id}"><small>Next stop →</small><span>${esc(next.name)}</span></a>` : `<a class="next" href="#board"><small>Fly home Jun 5 →</small><span>The whole trip</span></a>`}
  </nav>`;
}

function homePage() {
  const tiles = WISHES.map((w, i) => sticky(w, "Trip goal", i));
  tiles.splice(2, 0, `<div class="phrase tilt-a"><div class="lbl">First word to learn</div><div class="zh">你好</div><div class="py">nǐ hǎo</div><div class="en">Hello</div></div>`);
  tiles.splice(4, 0, `<div class="stamp"><span class="seal">中国</span><p>Eight stops. No flights in between.</p></div>`);
  return `
  <section class="hero">
    <div class="brush" lang="zh">中国</div>
    <div class="eyebrow">Janette, Josh &amp; Alex</div>
    <div>
      <h1>China 2027</h1>
      <p class="lede">One rail arc from Shanghai to Hong Kong: Disney twice, the Great Wall, pandas, a cyberpunk city, the Avatar peaks and the 20-yuan river. Open any stop to see its board.</p>
      <div class="facts"><span><b>May 17 – Jun 5, 2027</b></span><span>8 stops</span><span>19 nights</span><span>All by train</span></div>
    </div>
  </section>
  <div class="route" aria-label="Route">
    <ol>${CITIES.map((c, i) => `<li><a href="#${c.id}"><span class="num">${i + 1}</span><span class="nm">${esc(shortName(c))}</span><span class="dt">${esc(c.dates)}</span></a></li>`).join("")}</ol>
  </div>
  <div class="section-label eyebrow">The stops, in order</div>
  <section class="stops-grid">${CITIES.map(postcardCity).join("")}</section>
  <div class="section-label eyebrow">Trip goals</div>
  <section class="board">${tiles.join("")}</section>`;
}

function altsPage() {
  return `
  <section class="hero">
    <div class="brush" lang="zh">备选</div>
    <div class="eyebrow">Plan B, stop by stop</div>
    <div>
      <h1>Alternative activities</h1>
      <p class="lede">Swap-ins for a rainy afternoon, a scorching midday, a rest day or a free evening. Filter for what you need.</p>
    </div>
  </section>
  <div class="filters" role="group" aria-label="Filter activities">
    <button type="button" id="f-all" data-tag="" aria-pressed="true">All</button>
    ${ALT_TAGS.map(t => `<button type="button" id="f-${t.replace(/\s/g, "-").toLowerCase()}" data-tag="${t}" aria-pressed="false">${t}</button>`).join("")}
  </div>
  ${CITIES.map(c => `<section class="alt-city" data-city="${c.id}">
    <header><span class="zh" lang="zh">${c.zh}</span><h2>${esc(c.name)}</h2><a href="#${c.id}">${esc(c.dates)} · open board</a></header>
    <div class="alts">${(ALTS[c.id] || []).map(a => `<article class="alt" data-tags="${a.tags.join("|")}"><h3>${esc(a.title)}</h3><p>${esc(a.note)}</p><div class="foot"><div class="tags">${a.tags.map(t => `<span>${t}</span>`).join("")}</div><a href="${photoUrl(a.q)}" target="_blank" rel="noopener">Photos ↗</a></div></article>`).join("")}</div>
    <p class="empty" hidden>Nothing tagged that here.</p>
  </section>`).join("")}
  <div style="height:40px"></div>`;
}

function bindFilters() {
  const btns = main.querySelectorAll(".filters button");
  btns.forEach(b => b.addEventListener("click", () => {
    const tag = b.dataset.tag;
    btns.forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    main.querySelectorAll(".alt-city").forEach(sec => {
      let shown = 0;
      sec.querySelectorAll(".alt").forEach(a => {
        const ok = !tag || a.dataset.tags.split("|").includes(tag);
        a.hidden = !ok; if (ok) shown++;
      });
      sec.querySelector(".empty").hidden = shown > 0;
    });
  }));
}

/* ---------- routing ---------- */
const main = document.getElementById("main");
const nav = document.getElementById("nav");
nav.innerHTML = CITIES.map(c => `<a href="#${c.id}">${esc(shortName(c))}</a>`).join("") + `<a href="#alternatives">Alternatives</a>`;

function bindChecklists() {
  main.querySelectorAll(".checklist").forEach(box => {
    const key = "done-" + box.dataset.city;
    const count = box.querySelector(".count");
    const update = () => {
      const all = [...box.querySelectorAll("input")];
      const done = all.filter(x => x.checked).map(x => +x.dataset.i);
      count.textContent = `${done.length} of ${all.length} done`;
      return done;
    };
    update();
    box.addEventListener("change", () => save(key, update()));
  });
}

function route() {
  const id = location.hash.slice(1);
  const city = CITIES.find(c => c.id === id);
  sceneId = 0;
  const alts = id === "alternatives";
  main.innerHTML = city ? cityPage(city) : alts ? altsPage() : homePage();
  if (alts) bindFilters();
  nav.querySelectorAll("a").forEach(a => {
    if (a.getAttribute("href") === "#" + id) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });
  document.title = city ? `${city.name} · Our China Board` : alts ? "Alternatives · Our China Board" : "Our China Board";
  bindChecklists();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>

</body>
</html>
